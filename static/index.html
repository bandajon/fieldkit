<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldKit</title>
<link rel="icon" href="data:,"><!-- silence the /favicon.ico request -->

<style>
  :root {
    --bg:#111417; --panel:#191d21; --line:rgba(255,255,255,.14);
    --fg:#e8eaec; --dim:#8a939b;
    /* State only — never decoration. Used for 8px dots and text tints. */
    --ok:#4a9e6f; --bad:#c25454; --warn:#c29a4a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;   /* native checkboxes, date/time pickers and scrollbars follow */
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased;
         font:16px/1.45 "Avenir Next", Inter, system-ui, -apple-system, sans-serif; }
  /* Machine data is always mono + tabular so columns of numbers line up. */
  .mono, .num, .cam .name, .dev .ip, .dev .meta, .tile .cap, #diskinfo,
  input, select, textarea { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  #status { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap;
            padding:8px 8px; background:var(--bg); border-bottom:1px solid var(--line); }
  #status .cell { display:flex; flex-direction:column; gap:2px; padding:2px 14px;
                  border-left:1px solid var(--line); }
  #status .cell:first-child { border-left:0; }
  /* Once the rail wraps, a cell starting a new row would hang a divider off the
     left edge — CSS can't see "first in row", so drop them below the wrap point. */
  @media (max-width:700px) { #status .cell { border-left:0; padding-left:0; padding-right:20px; } }
  #status i { font-style:normal; font-size:10px; letter-spacing:.14em;
              text-transform:uppercase; color:var(--dim); }
  #status b { font:400 14px/1.3 var(--mono); font-variant-numeric:tabular-nums; }

  nav { display:flex; flex-wrap:wrap; padding:0 12px; border-bottom:1px solid var(--line); }
  nav button { flex:1 1 140px; min-height:52px;   /* 2x2 on a phone, one row on a laptop */ padding:0 16px; font-size:14px; font-weight:600;
               letter-spacing:.08em; text-transform:uppercase; color:var(--dim);
               background:none; border:0; border-bottom:2px solid transparent;
               cursor:pointer; transition:color 150ms; }
  nav button.on { color:var(--fg); border-bottom-color:var(--fg); }

  main { padding:22px 12px 48px; }
  section { display:none; }
  section.on { display:block; }
  h2 { margin:0 0 16px; font:600 11px/1 var(--mono); letter-spacing:.18em;
       text-transform:uppercase; color:var(--dim); }
  h2:empty { display:none; }

  a.btn { display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
  .btn { min-height:48px; padding:0 18px; font-size:15px; font-weight:600; color:var(--fg);
         background:none; border:1px solid var(--line); border-radius:4px; cursor:pointer;
         transition:background 150ms, border-color 150ms; }
  .btn:hover:not(:disabled) { background:rgba(255,255,255,.06); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.go { background:var(--fg); border-color:var(--fg); color:var(--bg); }
  .btn.go:hover:not(:disabled) { background:#fff; }
  .btn.halt { border-color:var(--bad); color:var(--bad); }
  .btn.halt:hover:not(:disabled) { background:rgba(194,84,84,.12); }
  .btn:focus-visible, nav button:focus-visible, summary:focus-visible {
    outline:2px solid var(--fg); outline-offset:2px; }
  .rowbtns { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .rowbtns .btn { flex:1; }

  .bar { height:4px; background:rgba(255,255,255,.10); border-radius:2px;
         overflow:hidden; margin:14px 0 6px; }
  .bar > div { height:100%; background:var(--fg); }

  .cam, .dev { background:var(--panel); border:1px solid var(--line); border-radius:4px;
               padding:16px; margin-bottom:10px; }
  .cam { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  .cam .name { flex:1 1 100px; font-size:16px; font-weight:600; }
  .num { color:var(--dim); font-size:14px; }
  .cam .btn { margin-left:auto; }
  .cam .btn.quiet { border-color:transparent; color:var(--dim); }
  .cam .btn.quiet:hover { border-color:var(--line); color:var(--fg); }
  .cam .btn.quiet + .btn { margin-left:0; }   /* Remove takes the push; Start sits beside it */
  .dev .head { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-bottom:14px; }
  .dev .ip { font-size:17px; font-weight:600; }
  .dev .meta { color:var(--dim); font-size:13px; }

  /* State = a coloured dot beside neutral text. No filled pills anywhere. */
  .state { display:inline-flex; align-items:center; gap:7px; color:var(--fg);
           font:600 12px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; }
  .state::before { content:''; width:8px; height:8px; border-radius:50%;
                   background:var(--dot); flex:none; }
  .s-ok { --dot:var(--ok); }
  .s-bad { --dot:var(--bad); }
  .s-warn { --dot:var(--warn); }
  .s-idle { --dot:var(--dim); }

  .acts { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .acts .btn { flex:1 1 120px; }
  input, select, textarea { min-height:48px; padding:0 12px; font-size:15px; color:var(--fg);
                            background:transparent; border:1px solid var(--line); border-radius:4px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--fg); }
  input { flex:1 1 140px; min-width:0; }
  input[type=checkbox] { width:22px; height:22px; min-height:0; flex:none; accent-color:var(--fg); }

  .res { margin-top:8px; font-size:14px; color:var(--dim); word-break:break-word;
         white-space:pre-line; }   /* failure text carries copy-paste commands on their own lines */
  .res.bad { color:var(--bad); }
  .res.warn { color:var(--warn); }
  .res.good { color:var(--ok); }

  #nvrlog { height:260px; overflow:auto; margin:14px 0; padding:12px; background:#0b0e10;
            border:1px solid var(--line); border-radius:4px; white-space:pre-wrap;
            font:13px/1.5 var(--mono); color:var(--dim); }
  #cfgtext { width:100%; min-height:320px; padding:12px; background:#0b0e10; color:var(--fg);
             border:1px solid var(--line); border-radius:4px; font:13px/1.5 var(--mono); }
  summary { cursor:pointer; padding:16px 0; font:600 11px/1 var(--mono); letter-spacing:.18em;
            text-transform:uppercase; color:var(--dim); }
  summary:hover { color:var(--fg); }

  #grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .tile .cap { padding:10px 12px; font-size:13px; color:var(--dim); }
  .tile img, .tile iframe { display:block; width:100%; aspect-ratio:16/9; border:0; background:#000; }
  .toggle .btn.on { background:rgba(255,255,255,.10); border-color:var(--fg); }
  #preview img { width:100%; max-width:640px; border:1px solid var(--line); border-radius:4px;
                 background:#000; display:block; margin-top:10px; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<div id="status">
  <span class="cell"><i>host</i><b id="s-host">…</b></span>
  <span class="cell"><i>bound ip</i><b id="s-ips">…</b></span>
  <span class="cell"><i>disk free</i><b id="s-disk">…</b></span>
  <span class="cell"><i>go2rtc</i><b id="s-live">…</b></span>
  <span class="cell"><i>clock</i><b id="s-time">…</b></span>
</div>

<nav>
  <button data-tab="cameras" class="on">Cameras</button>
  <button data-tab="record">Record</button>
  <button data-tab="nvr">NVR Pull</button>
  <button data-tab="monitor">Monitor</button>
</nav>

<main>
  <section id="cameras" class="on">
    <h2 id="cnt-cameras"></h2>
    <div class="rowbtns"><button class="btn go" id="scan">Scan LAN</button></div>
    <div id="scaninfo" class="res"></div>
    <div id="preview" hidden>
      <div class="rowbtns">
        <button class="btn" id="prev-full">Full-res shot</button>
        <button class="btn halt" id="prev-close">Close preview</button>
      </div>
      <div id="prev-label" class="res"></div>
      <img id="prev-img" alt="camera preview">
    </div>
    <div id="camlist"></div>
  </section>
  <section id="record">
    <h2 id="cnt-record"></h2>
    <div class="rowbtns">
      <button class="btn go" id="start-all">Start All</button>
      <button class="btn halt" id="stop-all">Stop All</button>
    </div>
    <div class="bar"><div id="diskbar"></div></div>
    <div id="diskinfo" class="num">…</div>
    <div id="reclist"></div>
  </section>
  <section id="nvr">
    <h2 id="cnt-nvr"></h2>
    <div class="acts">
      <input type="date" id="nvr-date">
      <input type="time" id="nvr-start" value="05:00">
      <input type="time" id="nvr-end" value="21:30">
    </div>
    <div class="rowbtns">
      <button class="btn go" id="pull-sel">Pull Selected</button>
      <button class="btn" id="pull-all">Pull All</button>
      <button class="btn" id="pull-dry">Dry Run</button>
    </div>
    <div id="nvrinfo" class="res"></div>
    <div id="nvrlist"></div>
    <div id="nvrlog"></div>
    <details id="cfgbox">
      <summary>Edit config.yaml</summary>
      <textarea id="cfgtext" spellcheck="false"></textarea>
      <div class="rowbtns">
        <button class="btn" id="cfgsave">Save config</button>
        <button class="btn halt" id="cfgreset">Reset to defaults</button>
      </div>
      <div id="cfgres" class="res">Added cameras take effect at once; removing one needs a restart.</div>
    </details>
  </section>
  <section id="monitor">
    <h2 id="cnt-monitor"></h2>
    <div class="rowbtns toggle">
      <button class="btn on" id="m-snap">Snapshots</button>
      <button class="btn" id="m-live">Live</button>
    </div>
    <div id="m-note" class="res"></div>
    <div id="grid"></div>
  </section>
</main>

<script>
let tab = 'cameras';
let hostIps = [];          // this host's IPv4s; a row off all of them is unreachable
const net24 = ip => ip.split('.').slice(0, 3).join('.');
const onOurNet = ip => hostIps.some(h => net24(h) === net24(ip));
let myNet = '192.168.1';   // /24 the Set IP suggestions live in; refreshed from /api/status
let go2rtc = 'absent';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === tab));
  if (tab === 'record') recPoll();
  if (tab === 'nvr') nvrPoll();
  if (tab === 'monitor') monRender();
});

async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    document.getElementById('s-host').textContent = s.hostname;
    document.getElementById('s-ips').textContent = s.ips.join(' ') || 'none';
    hostIps = s.ips;
    if (s.ips[0]) myNet = s.ips[0].split('.').slice(0, 3).join('.');
    document.getElementById('s-disk').textContent = s.disk_free_gb + ' GB';
    document.getElementById('s-time').textContent = s.time.replace('T', ' ');
    go2rtc = (s.go2rtc || {}).state || 'absent';
    document.getElementById('s-live').textContent = go2rtc;
    syncLiveToggle();
  } catch (e) {
    document.getElementById('s-time').textContent = 'server unreachable';
  }
}
refreshStatus();
setInterval(refreshStatus, 5000);

// --- Record tab ---
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Colour is state, never decoration: each label maps to one dot colour.
const STATE_KIND = {
  RECORDING:'ok', VERIFIED:'ok', ACTIVE:'ok', UP:'ok', 'ISAPI OK':'ok',
  RECONNECTING:'warn', RUNNING:'warn',
  ATTENTION:'bad', INACTIVE:'bad', DOWN:'bad', 'NO ISAPI':'bad',
};
const chip = label => `<span class="state s-${STATE_KIND[label] || 'idle'}">${esc(label)}</span>`;
// The tab bar already names the section, so the eyebrow carries only the count.
const setCount = (id, n, word) =>
  document.getElementById('cnt-' + id).textContent = n ? `${n} ${word}` : '';

async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                              body: JSON.stringify(body)});
  return r.json();
}

async function rec(act, cam) {
  await post('/api/record/' + act, {cams: cam ? [cam] : []});
  recPoll();
}
document.getElementById('start-all').onclick = () => rec('start');
document.getElementById('stop-all').onclick = () => rec('stop');
document.getElementById('reclist').onclick = async e => {
  const b = e.target.closest('button[data-cam]');
  if (!b) return;
  const cam = b.dataset.cam;
  if (b.dataset.act === 'rename') {
    const nn = (prompt(`Rename ${cam} to:\n(recordings already on disk keep the old folder name)`, cam) || '').trim();
    if (!nn || nn === cam) return;
    const r = await post('/api/config/rename_camera', {old: cam, new: nn});
    if (!r.ok) return alert(r.detail || 'rename failed');
    monCams = null;
    return recPoll();
  }
  if (b.dataset.act !== 'remove') return rec(b.dataset.act, cam);
  if (!confirm(`Remove ${cam} from config? Recordings on disk are kept.`)) return;
  const r = await post('/api/config/remove_camera', {name: cam});
  if (!r.ok) alert(r.detail || 'remove failed');
  monCams = null;               // Monitor refetches the shrunken list
  recPoll();
};

async function recPoll() {
  let s;
  try { s = await (await fetch('/api/record/status')).json(); } catch (e) { return; }
  const used = s.disk_total_gb ? (s.disk_total_gb - s.disk_free_gb) / s.disk_total_gb : 0;
  document.getElementById('diskbar').style.width = (used * 100).toFixed(0) + '%';
  document.getElementById('diskinfo').textContent =
    `${s.disk_free_gb} GB free of ${s.disk_total_gb} GB`;
  const cams = Object.entries(s.cameras);
  setCount('record', cams.length, 'configured');
  document.getElementById('reclist').innerHTML = cams.length === 0
    ? '<p class="res">No cameras in config.yaml.</p>'
    : cams.map(([n, c]) => {
        const act = c.state === 'STOPPED' ? 'start' : 'stop';
        return `<div class="cam">
          <span class="name">${esc(n)}</span>
          ${chip(c.state)}
          <span class="num">${c.minutes} min</span>
          <span class="num">${(c.bytes / 1e6).toFixed(1)} MB</span>
          ${c.restarts ? `<span class="num">${c.restarts} restarts</span>` : ''}
          ${act === 'start' ? `<button class="btn quiet" data-cam="${esc(n)}"
                  data-act="rename">Rename</button>
          <button class="btn quiet" data-cam="${esc(n)}"
                  data-act="remove">Remove</button>` : ''}
          <button class="btn${act === 'stop' ? ' halt' : ''}"
                  data-cam="${esc(n)}" data-act="${act}">${act === 'start' ? 'Start' : 'Stop'}</button>
        </div>`;
      }).join('');
}
setInterval(() => { if (tab === 'record' && !document.hidden) recPoll(); }, 2000);

// --- Cameras tab ---
let devs = [];

document.getElementById('scan').onclick = async () => {
  const b = document.getElementById('scan'), info = document.getElementById('scaninfo');
  b.disabled = true; b.textContent = 'Scanning…';
  info.className = 'res'; info.textContent = 'SADP probe + /24 sweep, ~5 s';
  try {
    const r = await post('/api/camera/scan', {});
    devs = r.cameras || [];
    setCount('cameras', devs.length, 'found');
    info.textContent = `${devs.length} device(s) on ${(r.cidrs || []).join(', ')}`;
    renderDevs();
  } catch (err) {
    info.textContent = 'scan failed: ' + err; info.className = 'res bad';
  }
  b.disabled = false; b.textContent = 'Scan LAN';
};

let configured = [];   // [{name, ip}] already in config.yaml
const loadConfigured = async () => {
  try { configured = await (await fetch('/api/cameras')).json(); } catch (e) {}
};
loadConfigured();
const nextCamName = () => {
  const used = new Set(configured.map(c => c.name));
  for (let n = 1; ; n++) if (!used.has('cam' + n)) return 'cam' + n;
};
async function addCamera(name, ip) {
  const r = await post('/api/config/add_camera', {name, ip});
  if (r.ok) { await loadConfigured(); monCams = null; }   // Monitor refetches the new list
  return r;
}

// null/undefined = the sweep 401'd, which proves nothing about activation.
const actBadge = a => chip(a == null ? 'ACT ?' : a ? 'ACTIVE' : 'INACTIVE');

function renderDevs() {
  document.getElementById('camlist').innerHTML = devs.length === 0
    ? '<p class="res">Nothing found. Cameras must be on this LAN and powered.</p>'
    : devs.map(d => `<div class="dev" data-ip="${esc(d.ip)}">
        <div class="head">
          <span class="ip">${esc(d.ip)}</span>
          ${actBadge(d.activated)}
          ${chip(d.reachable ? 'ISAPI OK' : 'NO ISAPI')}
          <span class="meta">${esc(d.model || 'unknown model')} · ${esc(d.mac || 'mac ?')} · ${esc(d.source)}${
            d.note ? ' · ' + esc(d.note) : ''}</span>
        </div>
        ${onOurNet(d.ip) ? '' : `<div class="acts">
          <span class="res warn">this machine has no address on ${esc(net24(d.ip))}.0/24 — actions will fail</span>
          <button class="btn" data-act="join">Join camera network</button>
        </div>`}
        ${d.activated === false ? `<div class="acts">
          <a class="btn" href="http://${esc(d.ip)}" target="_blank" rel="noopener">Open camera page to activate</a>
        </div>` : ''}
        <div class="acts">${d.activated
          ? `<input data-role="user" placeholder="user" value="admin" autocomplete="username">
             <input type="password" data-role="pw" placeholder="password" autocomplete="current-password">
             <button class="btn" data-act="login">Log in</button>`
          : `<input type="password" data-role="pw" placeholder="new password" autocomplete="new-password">
             <button class="btn" data-act="activate">Activate</button>`}
        </div>
        <div class="acts">
          <select data-role="plan"><option value="">cam…</option>${
            [1,2,3,4,5,6,7,8].map(n => `<option value="${n}">cam${n}</option>`).join('')}</select>
          <input data-role="addr" placeholder="new IP" inputmode="decimal">
          <button class="btn" data-act="setip">Set IP</button>
        </div>
        <div class="acts">
          <button class="btn" data-act="preview">Preview</button>
          <button class="btn" data-act="rtsp">Test RTSP</button>
          <button class="btn" data-act="synctime">Sync time</button>
          <input data-role="camname" placeholder="name (e.g. gate)">
          ${configured.some(c => c.ip === d.ip) ? ''
            : '<button class="btn" data-act="add">Add to config</button>'}
        </div>
        <div class="res" data-role="res"></div>
      </div>`).join('');
}

// cam1 = .111, cam2 = .112 … in the CAMERA's own /24 — the host's first IP can be
// a VPN/Tailscale address, which would suggest slots in a network the camera isn't on.
document.getElementById('camlist').addEventListener('change', e => {
  const sel = e.target.closest('select[data-role="plan"]');
  if (!sel || !sel.value) return;
  const card = sel.closest('.dev');
  card.querySelector('[data-role="addr"]').value =
    `${net24(card.dataset.ip)}.${110 + Number(sel.value)}`;
});

document.getElementById('camlist').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const card = b.closest('.dev'), ip = card.dataset.ip;
  const res = card.querySelector('[data-role="res"]');
  const show = (msg, cls) => { res.textContent = msg; res.className = 'res ' + (cls || ''); };
  if (b.dataset.act === 'preview') return openPreview(ip);
  const was = b.textContent;
  b.disabled = true; b.textContent = '…';
  try {
    if (b.dataset.act === 'activate') {
      const pw = card.querySelector('[data-role="pw"]').value;
      if (!pw) show('enter a password first', 'bad');
      else {
        const r = await post('/api/camera/activate', {ip, password: pw});
        show(r.ok ? 'activated' : (r.error || r.detail || 'failed'), r.ok ? 'good' : 'bad');
      }
    } else if (b.dataset.act === 'login') {
      const pw = card.querySelector('[data-role="pw"]').value;
      const user = card.querySelector('[data-role="user"]').value || 'admin';
      if (!pw) show('enter the password first', 'bad');
      else {
        const r = await post('/api/camera/login', {ip, user, password: pw});
        if (r.ok) {
          const d = devs.find(x => x.ip === ip);      // fill in what auth unlocked
          if (d) Object.assign(d, {model: r.model || d.model, mac: r.mac || d.mac,
                                   note: 'logged in'});
          show('logged in — credentials remembered for this camera', 'good');
          card.querySelector('.meta').textContent =
            `${r.model || 'unknown model'} · ${r.mac || 'mac ?'} · logged in`;
        } else show(r.detail || 'log in failed', 'bad');
      }
    } else if (b.dataset.act === 'setip') {
      const slot = card.querySelector('[data-role="plan"]').value;
      const address = card.querySelector('[data-role="addr"]').value.trim();
      if (!address) show('pick a cam slot or type an IP first', 'bad');
      else {
        // If the operator typed a password (e.g. after activating on the camera's own
        // web page), send it — the server then remembers it for the camera's new IP.
        const pw = card.querySelector('[data-role="pw"]').value;
        const r = await post('/api/camera/set_ip', pw ? {ip, address, password: pw} : {ip, address});
        let msg = r.ok ? `now ${address}${r.rebooted ? ' — rebooting' : ''}`
                       : (r.error || r.detail || 'failed');
        const nm = card.querySelector('[data-role="camname"]').value.trim();
        if (r.ok && slot) {
          const a = await addCamera(nm || 'cam' + slot, address);   // it reboots onto this one
          msg += a.ok ? ` · added to config as ${a.name}` : ` · not added: ${a.detail || ''}`;
        }
        show(msg, r.ok ? 'good' : 'bad');
      }
    } else if (b.dataset.act === 'add') {
      const slot = card.querySelector('[data-role="plan"]').value;
      const nm = card.querySelector('[data-role="camname"]').value.trim();
      const a = await addCamera(nm || (slot ? 'cam' + slot : nextCamName()), ip);
      show(a.ok ? `added to config as ${a.name}` : (a.detail || 'failed'), a.ok ? 'good' : 'bad');
      if (a.ok) b.remove();   // configured now; re-rendering here would wipe the message
    } else if (b.dataset.act === 'join') {
      const r = await post('/api/host/join_network', {camera_ip: ip});
      if (r.ok) {
        await refreshStatus();
        renderDevs();          // clears the warning on every row on this net
        const fresh = document.querySelector(`.dev[data-ip="${CSS.escape(ip)}"] [data-role="res"]`);
        if (fresh) { fresh.textContent = `joined as ${r.ip} on ${r.iface}`; fresh.className = 'res good'; }
      } else {
        show(`${r.error || r.detail || 'failed'}\n\nrun this once, then the button works:\n${
          r.grant || ''}\n\nor do it by hand now:\n${r.cmd || ''}`, 'bad');
      }
    } else if (b.dataset.act === 'rtsp') {
      const r = await post('/api/camera/test_rtsp', {ip});
      show(r.ok ? `${r.codec} ${r.width}x${r.height} @ ${r.fps}`
                : (r.error || r.detail || 'failed'), r.ok ? 'good' : 'bad');
    } else if (b.dataset.act === 'synctime') {
      const r = await post('/api/camera/set_time', {ip});
      show(r.ok ? `camera clock set — device says ${r.camera_time || 'ok'} (${r.tz})`
                : (r.error || r.detail || 'failed'), r.ok ? 'good' : 'bad');
    }
  } catch (err) {
    show(String(err), 'bad');
  }
  b.disabled = false; b.textContent = was;
});

// Preview: poll the server-side snapshot proxy into an <img> (browser can't do digest auth).
let prevIp = null, prevTimer = null;
const prevImg = document.getElementById('prev-img');

function snapUrl(ip) {
  return `/api/camera/snapshot?ip=${encodeURIComponent(ip)}&_=${Date.now()}`;
}
function tickPreview() {
  if (prevIp && !document.hidden && tab === 'cameras') prevImg.src = snapUrl(prevIp);
}
function openPreview(ip) {
  prevIp = ip;
  document.getElementById('preview').hidden = false;
  document.getElementById('prev-label').textContent = 'preview ' + ip;
  if (!prevTimer) prevTimer = setInterval(tickPreview, 700);
  tickPreview();
}
prevImg.onerror = () => {
  document.getElementById('prev-label').textContent = `preview ${prevIp} — no image (unreachable or wrong credentials)`;
};
prevImg.onload = () => {
  document.getElementById('prev-label').textContent = 'preview ' + prevIp;
};
document.getElementById('prev-close').onclick = () => {
  prevIp = null;
  clearInterval(prevTimer); prevTimer = null;
  document.getElementById('preview').hidden = true;
  prevImg.removeAttribute('src');
};
document.getElementById('prev-full').onclick = () => {
  if (prevIp) window.open(snapUrl(prevIp), '_blank');
};

// --- NVR Pull tab ---
const sel = new Set();   // checked sites, kept across the 5 s re-render
// en-CA gives YYYY-MM-DD in LOCAL time; toISOString() would be the UTC day.
document.getElementById('nvr-date').value = new Date().toLocaleDateString('en-CA');
const nvrDate = () => document.getElementById('nvr-date').value;

async function nvrPoll() {
  let r;
  try { r = await (await fetch('/api/nvr/list?date=' + encodeURIComponent(nvrDate()))).json(); }
  catch (e) { return; }
  const list = r.nvrs || [];
  const names = new Set(list.map(n => n.name));      // drop ghosts after a config rename
  [...sel].forEach(s => names.has(s) || sel.delete(s));
  setCount('nvr', list.length, 'configured');
  if (!list.length) document.getElementById('nvrinfo').textContent = 'No NVRs in config.yaml.';
  document.getElementById('nvrlist').innerHTML = list.map(n => `<div class="dev">
      <div class="head">
        <label class="ip"><input type="checkbox" data-site="${esc(n.name)}"${
          sel.has(n.name) ? ' checked' : ''}> ${esc(n.name)}</label>
        ${chip(n.reachable ? 'UP' : 'DOWN')}
        ${n.state ? chip(n.state) : ''}
        <span class="meta">${esc(n.host)} · ${n.channels} ch${n.verified ? ' · .verified' : ''}</span>
        ${n.manifest ? `<a class="meta" target="_blank" href="/api/nvr/manifest?site=${
          encodeURIComponent(n.name)}&date=${encodeURIComponent(r.date)}">manifest.json</a>` : ''}
      </div></div>`).join('');
}

document.getElementById('nvrlist').addEventListener('change', e => {
  const c = e.target.closest('input[type=checkbox][data-site]');
  if (c) c.checked ? sel.add(c.dataset.site) : sel.delete(c.dataset.site);
});
document.getElementById('nvr-date').addEventListener('change', nvrPoll);

async function pull(sites, dry) {
  const r = await post('/api/nvr/pull', {
    sites, dry, date: nvrDate(),
    start: document.getElementById('nvr-start').value,
    end: document.getElementById('nvr-end').value
  });
  document.getElementById('nvrinfo').textContent = r.detail
    ? 'error: ' + r.detail
    : `started: ${(r.started || []).join(', ') || 'nothing (already running?)'}`;
  nvrPoll();
}
// An empty sites list means ALL to the server, so only Pull All may send one.
function pullSelected(dry) {
  if (sel.size === 0) {
    document.getElementById('nvrinfo').textContent = 'select at least one NVR';
    return;
  }
  pull([...sel], dry);
}
document.getElementById('pull-sel').onclick = () => pullSelected(false);
document.getElementById('pull-all').onclick = () => pull([], false);
document.getElementById('pull-dry').onclick = () => pullSelected(true);

// Live log over SSE; the server replaces nvr_pull.log to feed this.
const logPane = document.getElementById('nvrlog');
const logLines = [];
new EventSource('/api/nvr/logstream').onmessage = e => {
  const d = JSON.parse(e.data);
  logLines.push(`[${d.t}] [${d.site}] ${d.msg}`);
  if (logLines.length > 500) logLines.shift();
  const atBottom = logPane.scrollTop + logPane.clientHeight >= logPane.scrollHeight - 40;
  logPane.textContent = logLines.join('\n');
  if (atBottom) logPane.scrollTop = logPane.scrollHeight;
};

const cfgbox = document.getElementById('cfgbox');
cfgbox.addEventListener('toggle', async () => {
  if (cfgbox.open) document.getElementById('cfgtext').value =
    (await (await fetch('/api/config')).json()).text;
});
document.getElementById('cfgsave').onclick = async () => {
  const res = document.getElementById('cfgres');
  const r = await post('/api/config', {text: document.getElementById('cfgtext').value});
  res.textContent = r.ok ? 'saved — added cameras are live; removals need a restart'
                         : 'not saved: ' + (r.detail || 'unknown error');
  res.className = 'res ' + (r.ok ? 'good' : 'bad');
  if (r.ok) nvrPoll();
};
document.getElementById('cfgreset').onclick = async () => {
  if (!confirm('Replace config.yaml with the shipped defaults? Cameras and NVRs you ' +
               'added are forgotten (recordings on disk are kept).')) return;
  const res = document.getElementById('cfgres');
  const r = await post('/api/config/reset', {});
  if (r.ok) {
    document.getElementById('cfgtext').value = r.text;
    res.textContent = 'reset to defaults — applied to recorder and monitor';
    res.className = 'res good';
    monCams = null; nvrPoll();
  } else {
    res.textContent = 'not reset: ' + (r.detail || 'unknown error');
    res.className = 'res bad';
  }
};

setInterval(() => { if (tab === 'nvr' && !document.hidden) nvrPoll(); }, 5000);

// --- Monitor tab ---
let monCams = null, monMode = 'snapshots';
const LIVE_NOTE = 'Live is the 640×360 sub-stream for aiming, not evidence quality. ' +
                  'Recording quality is unaffected.';

function syncLiveToggle() {
  const b = document.getElementById('m-live');
  if (!b) return;
  b.disabled = go2rtc !== 'running';
  if (monMode === 'live' && go2rtc !== 'running') setMode('snapshots');   // sidecar died
  const note = document.getElementById('m-note');
  if (monMode === 'live') note.textContent = LIVE_NOTE;
  else if (go2rtc === 'running') note.textContent = 'Live video available.';
  else if (go2rtc === 'absent') note.textContent =
    'Live needs go2rtc: download the binary for this platform and set go2rtc_binary in config.yaml.';
  else note.textContent = `go2rtc is ${go2rtc} — snapshots only until it is running.`;
}

async function monRender() {
  if (!monCams) monCams = await (await fetch('/api/cameras')).json();
  setCount('monitor', monCams.length, 'configured');
  const host = location.hostname;
  document.getElementById('grid').innerHTML = monCams.length === 0
    ? '<p class="res">No cameras in config.yaml.</p>'
    : monCams.map(c => `<div class="tile" data-name="${esc(c.name)}" data-ip="${esc(c.ip)}">
        <div class="cap">${esc(c.name)} · ${esc(c.ip)}</div>
        ${monMode === 'live'
          ? `<iframe src="http://${esc(host)}:1984/stream.html?src=${encodeURIComponent(c.name)}"
                     allow="autoplay; fullscreen"></iframe>`
          : '<img alt="">'}
      </div>`).join('');
  if (monMode === 'snapshots') monTick();
}

function monTick() {
  if (tab !== 'monitor' || document.hidden || monMode !== 'snapshots') return;
  document.querySelectorAll('#grid .tile').forEach(t => {
    const img = t.querySelector('img');
    if (img) img.src = snapUrl(t.dataset.ip);
  });
}

function setMode(mode) {
  monMode = mode;
  document.getElementById('m-snap').classList.toggle('on', mode === 'snapshots');
  document.getElementById('m-live').classList.toggle('on', mode === 'live');
  monRender();
  syncLiveToggle();
}
document.getElementById('m-snap').onclick = () => setMode('snapshots');
document.getElementById('m-live').onclick = () => setMode('live');

setInterval(monTick, 1000);   // 1 fps, and monTick no-ops when the tab is hidden
</script>
</body>
</html>
