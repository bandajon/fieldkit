# FieldKit config.

cameras:                 # cameras recorded directly over RTSP
  - name: cam1
    ip: 192.168.1.111
    user: admin
    password: ""
  - name: cam2
    ip: 192.168.1.112
    user: admin
    password: ""
    # Optional per-camera measurement config (events gain direction + speed):
    # heading: north   # compass direction the camera FACES. north = it looks toward the
    #                  # toll gate, south = away from it (Katuba); or put the word in the
    #                  # camera name (katuba-north). Gives every vehicle its direction of
    #                  # travel and whether it is heading toward or away from the gate.
    # gate_ahead: true # override: is the gate in the camera's view direction? Defaults to
    #                  # true for a north camera, false for a south one.
    # count_line: 0.55 # with a heading set, a vehicle is counted ONCE, when its centre crosses
    #                  # this line across the travel axis (fraction of the frame) — so a queue
    #                  # that crawls, stops and re-appears is never counted twice. null = count
    #                  # on sight, as a camera without a heading does.
    # travel: {axis: y, neg: northbound, pos: southbound}   # only if heading cannot say it
    # speed_lines: {a: 0.55, b: 0.75, metres: 25}   # two reference lines on the travel
    #                                               # axis (normalized) + real distance

site: site1              # this node's site name; recordings land in <record_dir>/<site>/<cam>/
# The RDA toll gate this node sits at. Local disk stays keyed by `site` above — this is the
# name the bucket uses, so footage from nine gates sorts by authority rather than by whatever
# each box was called during install. Unset falls back to `site`, which is what nodes did
# before this key existed. Katuba is RDA-TG-KTB; the full list is in the Lauretta guide.
toll_gate_id: ''          # e.g. RDA-TG-KTB -> r2://<bucket>/RDA-TG-KTB/<cam>/<segment>.mkv
record_dir: ./recordings # root for ffmpeg segment recordings
go2rtc_binary: ""        # path to the go2rtc binary; empty = Monitor stays on snapshots
detect_backend: cpu      # Monitor vehicle detection: cpu (needs pip install ultralytics pillow) — hailo lands with the site AI servers
# hef_path: ""           # hailo only: compiled model from the Hailo model zoo
# detect_weights: dataset/champion.pt          # the crowned fine-tune: python dataset_sync.py models
# attr_weights: dataset/attrs-champion.pt      # ...and its attribute heads (type/axles/cargo on Monitor)
camera_defaults:         # credentials tried by the discovery sweep on unknown cameras
  user: admin
  password: ""

# Cloudflare R2 offload. Nothing ever leaves this node unless enabled is true.
# Credentials: Cloudflare dashboard -> R2 -> Manage R2 API Tokens (Object Read & Write,
# scoped to the bucket). Needs `pip install boto3`.
offload:
  enabled: false         # leave false to self-host: footage stays on the drive
  account_id: ""         # Cloudflare account ID; the endpoint is <account_id>.r2.cloudflarestorage.com
  access_key_id: ""      # R2 API token key
  secret_access_key: ""  # R2 API token secret
  # Any field above may stay empty on a node enrolled with an ops console whose
  # R2_* env vars are set: it supplies them in memory at connect and they are never
  # written back here. Anything you DO set wins over the console for that field, so
  # leave a key blank rather than guessing it. `enabled` stays this node's own switch.
  bucket: ""             # empty = whatever the console supplies, else fieldkit-recordings
  min_free_gb: 20        # below this, the oldest finished segments upload and are then deleted
  mirror: false          # true = back every finished segment up as it closes; local copies
                         # still stay until min_free_gb needs the space
  contribute: false      # true = this node uploads the frames it captures for the labelling
                         # team; independent of mirror, and recordings are unaffected either way

# Ops console (optional). Leave this block out — or any field empty — and the node
# never phones home; it is a self-contained site console, exactly as before.
ops:
  url: ""                # ws://<console-host>:8090/ingest — outbound only, console never dials in
  token: ""              # enrollment token, issued once by the console's Enroll page
  hive: ""               # hive tag this node belongs to, e.g. kalambo
